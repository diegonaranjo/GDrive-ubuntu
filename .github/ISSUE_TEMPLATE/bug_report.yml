name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security issues, use SECURITY.md instead of opening an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Actual behavior, and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Distribution, app version, rclone version, Wayland or X11.
      placeholder: |
        Ubuntu 26.04 (GNOME, Wayland), GDrive 1.0.0, rclone 1.74.3
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        Paste from ~/.config/gdrive/debug.log or `journalctl --user -u
        gdrive-tray.service`. Redact file names or account details you do not
        want public.
      render: shell
