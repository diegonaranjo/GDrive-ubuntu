name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Identity & secret guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_BASE:-}" ] && [ -n "${PR_HEAD:-}" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "${BEFORE:-}" ] && ! printf '%s' "$BEFORE" | grep -q '^0*$'; then
            range="$BEFORE..$SHA"
          else
            range="$SHA"
          fi
          echo "scanning $range"
          chmod +x tools/secret-scan.sh
          ./tools/secret-scan.sh range "$range"

  rust:
    name: Rust (fmt + clippy + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/gdrive-core
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/gdrive-core

      - name: Format (rustfmt --check)
        run: cargo fmt --all -- --check

      - name: Clippy (strict linting)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo test --all-targets --locked

      - name: Build release
        run: cargo build --release --locked

  python:
    name: Python (syntax compilation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify UI syntax
        run: |
          python3 -m py_compile gdrive/*.py gdrive/pages/*.py gdrive-app.py gdrive-tray.py