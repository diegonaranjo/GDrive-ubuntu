[package]
name = "gdrive-ui"
version = "2.0.0-alpha.1"
edition = "2021"
description = "GDrive native GTK4/libadwaita UI (Rust port of the Python window)."
license = "MIT"

[[bin]]
name = "gdrive-ui"
path = "src/main.rs"

[dependencies]
# GTK4 + libadwaita (native widgets, same look-and-feel as the Python UI).
gtk4 = "0.11"
# v1_4 exposes `ToolbarView` (used by the shell); higher features are enabled
# on demand as later phases need newer libadwaita widgets.
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
# GLib main loop + GIO D-Bus client (idiomatic GTK approach, no async runtime).
glib = "0.22"
gio = "0.22"
# JSON parsing for `rclone about --json` (Account page).
serde_json = "1"
# Typed errors (same convention as gdrive-core).
thiserror = "2"

# Project lints (same rules as gdrive-core). See rust-best-practices.
[lints.rust]
unsafe_code = { level = "forbid", priority = 3 }
nonstandard_style = { level = "deny", priority = -2 }
future-incompatible = { level = "warn", priority = -3 }

[lints.clippy]
all = { level = "warn", priority = -1 }
redundant_clone = { level = "warn", priority = 1 }
clone_on_copy = { level = "warn", priority = 1 }
needless_collect = { level = "warn", priority = 1 }
map_unwrap_or = { level = "warn", priority = 1 }

[profile.release]
opt-level = 2
strip = true