[package]
name = "gdrive-core"
version = "1.1.0"
edition = "2021"
description = "GDrive core: config, sync (rclone bisync), logging and i18n. Native engine for the desktop client."
license = "MIT"

[lib]
name = "gdrive_core"
path = "src/lib.rs"

[[bin]]
name = "gdrive-core"
path = "src/main.rs"

[[bin]]
name = "gdrive-daemon"
path = "src/bin/daemon.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# File-system change detection (inotify on Linux) used to trigger real-time
# synchronization. Stable 8.x series.
notify = "8"
# D-Bus (Phase 2). tokio only as the runtime, so it doesn't spawn extra threads behind our back.
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

[dev-dependencies]
tempfile = "3"

# Project lints. See rust-best-practices, chapter 2. They run with
# `cargo clippy --all-targets --all-features --locked -- -D warnings`.
# `pedantic`/`nursery` are left as opt-in (see Makefile/CI) because of their noise.
# The explicit priorities avoid conflicts between groups and individual lints.
[lints.rust]
unsafe_code = { level = "forbid", priority = 3 }
nonstandard_style = { level = "deny", priority = -2 }
future-incompatible = { level = "warn", priority = -3 }

[lints.clippy]
all = { level = "warn", priority = -1 }
redundant_clone = { level = "warn", priority = 1 }
clone_on_copy = { level = "warn", priority = 1 }
needless_collect = { level = "warn", priority = 1 }
map_unwrap_or = { level = "warn", priority = 1 }

[profile.release]
opt-level = 2
strip = true