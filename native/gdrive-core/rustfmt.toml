# rustfmt: project formatting configuration.
#
# Note: `imports_granularity` and `group_imports` (automatic std → external →
# crate grouping) are NIGHTLY-ONLY options. On stable they emit a warning and
# are not applied, which would break `cargo fmt --check` in CI. That is why they
# are omitted here; import order is maintained manually following
# rust-best-practices, chapter 1.7.
edition = "2021"